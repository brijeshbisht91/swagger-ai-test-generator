name: API Automation Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  run-tests:
    runs-on: ubuntu-latest

    services:
      ollama:
        image: ollama/ollama
        ports:
          - 11434:11434

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ---------------------------
      # Java Setup
      # ---------------------------
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven

      # ---------------------------
      # Python (Swagger AI / LangGraph)
      # ---------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # ---------------------------
      # Wait for Ollama
      # ---------------------------
      - name: Wait for Ollama
        run: |
          echo "Waiting for Ollama..."
          sleep 15
          curl http://localhost:11434

      # ---------------------------
      # Pull Model
      # ---------------------------
      - name: Pull Ollama Model
        run: docker exec ${{ job.services.ollama.id }} ollama pull llama3.2:3b

      # ---------------------------
      # Run Swagger AI Script
      # ---------------------------
      # --force-all: CI should always regenerate every target test (no reliance on swagger.previous.json)
      - name: Run Swagger AI
        run: python swagger_ai_graph.py --force-all
        env:
          OLLAMA_HOST: http://localhost:11434

      # ---------------------------
      # Run API Tests
      # ---------------------------
      - name: Run API Tests
        run: |
          cd java-tests
          mvn clean test

      # ---------------------------
      # Upload Allure Results
      # ---------------------------
      - name: Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: java-tests/target/allure-results

      # ---------------------------
      # (Optional) Upload AI Output
      # ---------------------------
      - name: Upload generated Java tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-java-tests
          path: java-tests/src/test/java/tests